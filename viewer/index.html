<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse Slotting — 3D Viewer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #111;
        font-family: system-ui, -apple-system, sans-serif;
        color: #eee;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        background: rgba(0, 0, 0, 0.65);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
      #hud strong { color: #7FBF9E; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
